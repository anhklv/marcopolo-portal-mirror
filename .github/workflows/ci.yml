name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          AUTH_SECRET: "ci-build-secret-minimum-32-characters-long"
          AUTH_URL: "http://localhost:3000"
          AUTH_TRUST_HOST: "true"
        run: npm run build
