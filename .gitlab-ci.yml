stages:
  - verify
  - deploy

default:
  image: node:20
  tags:
    - docker

variables:
  VERCEL_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push


# =========================
# VERIFY
# =========================

verify:
  stage: verify

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      variables:
        DATABASE_URL: "$DATABASE_URL_DEVELOP"

    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
      variables:
        DATABASE_URL: "$DATABASE_URL_STAGING"

    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      variables:
        DATABASE_URL: "$DATABASE_URL_PRODUCTION"

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      variables:
        DATABASE_URL: "$DATABASE_URL_DEVELOP"

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
      variables:
        DATABASE_URL: "$DATABASE_URL_STAGING"

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      variables:
        DATABASE_URL: "$DATABASE_URL_PRODUCTION"

  before_script:
    - node --version
    - npm --version
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL is missing" && exit 1)

  script:
    - npm ci
    - npx prisma generate
    - npm run lint
    - npm test --if-present
    - npm run build


# =========================
# DEVELOP
# =========================

deploy_develop:
  stage: deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'

  variables:
    VERCEL_PROJECT_ID: "$VERCEL_PROJECT_ID_STAGING"
    DATABASE_URL: "$DATABASE_URL_DEVELOP"

  before_script:
    - node --version
    - npm --version
    - npm install --global vercel@latest

  script:
    - test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is missing" && exit 1)
    - test -n "$VERCEL_ORG_ID" || (echo "VERCEL_ORG_ID is missing" && exit 1)
    - test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID_STAGING is missing" && exit 1)
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL_DEVELOP is missing" && exit 1)

    - rm -rf .vercel

    - vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

    - vercel build --target=preview --token="$VERCEL_TOKEN"

    - |
      DEPLOYMENT_URL=$(vercel deploy \
        --prebuilt \
        --target=preview \
        --token="$VERCEL_TOKEN" \
        --archive=tgz \
        --meta gitlabDeployment="1" \
        --meta gitlabEnvironment="develop" \
        --meta gitlabCommitSha="$CI_COMMIT_SHA" \
        --meta gitlabCommitRef="$CI_COMMIT_REF_NAME" \
        --meta gitlabProjectPath="$CI_PROJECT_PATH")

      echo "Develop deployment: $DEPLOYMENT_URL"

      vercel alias set \
        "$DEPLOYMENT_URL" \
        develop.marcopolo-portal.jp \
        --token="$VERCEL_TOKEN"

  environment:
    name: develop
    url: https://develop.marcopolo-portal.jp


# =========================
# STAGING
# =========================

deploy_staging:
  stage: deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'

  variables:
    VERCEL_PROJECT_ID: "$VERCEL_PROJECT_ID_STAGING"
    DATABASE_URL: "$DATABASE_URL_STAGING"

  before_script:
    - node --version
    - npm --version
    - npm install --global vercel@latest

  script:
    - test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is missing" && exit 1)
    - test -n "$VERCEL_ORG_ID" || (echo "VERCEL_ORG_ID is missing" && exit 1)
    - test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID_STAGING is missing" && exit 1)
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL_STAGING is missing" && exit 1)

    - rm -rf .vercel

    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - vercel build --prod --token="$VERCEL_TOKEN"

    - |
      vercel deploy \
        --prebuilt \
        --prod \
        --token="$VERCEL_TOKEN" \
        --archive=tgz \
        --meta gitlabDeployment="1" \
        --meta gitlabEnvironment="staging" \
        --meta gitlabCommitSha="$CI_COMMIT_SHA" \
        --meta gitlabCommitRef="$CI_COMMIT_REF_NAME" \
        --meta gitlabProjectPath="$CI_PROJECT_PATH"

  environment:
    name: staging
    url: https://staging.marcopolo-portal.jp


# =========================
# PRODUCTION
# =========================

deploy_production:
  stage: deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

  variables:
    VERCEL_PROJECT_ID: "$VERCEL_PROJECT_ID_PRODUCTION"
    DATABASE_URL: "$DATABASE_URL_PRODUCTION"

  before_script:
    - node --version
    - npm --version
    - npm install --global vercel@latest

  script:
    - test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is missing" && exit 1)
    - test -n "$VERCEL_ORG_ID" || (echo "VERCEL_ORG_ID is missing" && exit 1)
    - test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID_PRODUCTION is missing" && exit 1)
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL_PRODUCTION is missing" && exit 1)

    - rm -rf .vercel

    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - vercel build --prod --token="$VERCEL_TOKEN"

    - |
      vercel deploy \
        --prebuilt \
        --prod \
        --token="$VERCEL_TOKEN" \
        --archive=tgz \
        --meta gitlabDeployment="1" \
        --meta gitlabEnvironment="production" \
        --meta gitlabCommitSha="$CI_COMMIT_SHA" \
        --meta gitlabCommitRef="$CI_COMMIT_REF_NAME" \
        --meta gitlabProjectPath="$CI_PROJECT_PATH"

  environment:
    name: production
    url: https://marcopolo-portal.jp