stages:
  - verify

default:
  image: node:22
  tags:
    - docker-local

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

verify:
  stage: verify

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

  before_script:
    - node --version
    - npm --version

  script:
    - npm ci
    - npm run lint
    - npm test --if-present
    - npm run build